name: Amsterdam Events Pipeline

# DISARMATO il 18/08/2026. La pipeline e' stata rimpatriata su capitan il
# 30/07/2026 (launchd: com.local.events-collect ogni giorno 06:00,
# com.local.events-digest il lunedi 06:30). Lo schedule qui sotto era rimasto
# armato: se avesse girato, il lunedi avrebbe inviato una SECONDA newsletter
# identica allo stesso destinatario esterno, e avrebbe committato
# "Auto-update DB" sopra il lavoro locale.
# Resta solo il trigger manuale, come rete di sicurezza se capitan e' giu'.
on:
  workflow_dispatch:  # Manual trigger button in GitHub Actions UI

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      collect_outcome: ${{ steps.collect.outcome }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Daily: collect events + update site ──
      # main.py exits 1 when a source with history in the DB returns 0 events.
      # We don't abort here — the digest, DB commit and Pages deploy must still
      # run — the check-sources job below turns the whole run red instead.
      - name: Collect events from all sources
        id: collect
        continue-on-error: true
        run: python main.py collect

      - name: Export events JSON for calendar site
        run: python export_json.py

      # ── Monday only: build digest + send email ──
      - name: Check day of week
        id: check_day
        run: echo "day=$(date -u +%a)" >> $GITHUB_OUTPUT

      - name: Build & send weekly email digest (Monday only)
        if: steps.check_day.outputs.day == 'Mon' || github.event_name == 'workflow_dispatch'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          # Era l'indirizzo in chiaro di una persona reale, in un repo PUBBLICO,
          # dal commit iniziale. Ora arriva dai secret come le altre credenziali.
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py send

      # ── Daily: persist DB + deploy site ──
      - name: Persist DB back to repo
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add data/events.db data/lastfm_cache.db
          git commit -m "Auto-update DB: $(date +'%Y-%m-%d')" || echo "No changes"
          git pull --rebase --autostash origin main || true
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  # Fails the run when a collector went silent, without having blocked any of
  # the work above. This is what makes a stale scraper visible: before, a source
  # collapsing to 0 events only logged a WARNING and the run stayed green.
  check-sources:
    runs-on: ubuntu-latest
    needs: update
    if: always() && needs.update.outputs.collect_outcome == 'failure'
    steps:
      - name: Report broken collectors
        run: |
          echo "::error::One or more collectors returned 0 events despite having history in the DB — see the 'Collect events from all sources' step log for the source names."
          echo "⚠️ A collector went silent — check the collect step log." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
